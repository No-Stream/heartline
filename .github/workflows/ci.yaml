---
name: CI

"on":
  push:
    branches: [main, master]
  pull_request:

# Every job has a timeout, because GitHub's default of 360 minutes lets a hung step
# occupy a required check for six hours. Revisit the caps once real timings exist.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml pins the version, components and WebAssembly target.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: make install
      # TypeScript checks import the generated WebAssembly bindings.
      - run: npx playwright install --with-deps chrome
      - run: make build
      - run: make lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: make install
      # make test-web rasterizes the sprite atlas through headless Chrome.
      - run: npx playwright install --with-deps chrome
      - run: make build
      - run: make test-rust
      - run: make test-web

  test-threads:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: make test-threads

  test-flexibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: make test-flexibility

  e2e-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: make install
      - run: npx playwright install --with-deps chrome
      - run: make build
      - name: Build the coaster piece catalog fixture
        run: |
          mkdir -p target/e2e
          cargo run --quiet --release -p theme-park-sim --example piece_visual_fixture > target/e2e/piece-catalog.json
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-build
          path: |
            web/art/atlas/
            web/src/wasm/
            web/dist/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-piece-catalog
          path: target/e2e/piece-catalog.json
          if-no-files-found: error
          retention-days: 1

  e2e-feature:
    needs: e2e-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --cpuset-cpus=0-3 --cpus=4 --memory=12g --memory-swap=12g --shm-size=2g
    env:
      THEME_PARK_COMPUTE_CPUS: "0-3"
      THEME_PARK_PLAYWRIGHT_DOCKER: "1"
      THEME_PARK_PLAYWRIGHT_IN_CONTAINER: "1"
      THEME_PARK_PIECE_CATALOG_FIXTURE: target/e2e/piece-catalog.json
    strategy:
      fail-fast: false
      matrix:
        shard: [1/6, 2/6, 3/6, 4/6, 5/6, 6/6]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: make install
      - uses: actions/download-artifact@v4
        with:
          name: e2e-build
          path: web/
      - uses: actions/download-artifact@v4
        with:
          name: e2e-piece-catalog
          path: target/e2e/
      - run: npm run e2e -- --project=feature --shard=${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-feature-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/

  e2e:
    needs: e2e-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: journey, shard: 1/1 }
          - { project: smoothness, shard: 1/1 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: make install
      - run: npx playwright install --with-deps chrome
      - uses: actions/download-artifact@v4
        with:
          name: e2e-build
          path: web/
      - run: npm run e2e -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/

  secret_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # The action scans a commit range, so it needs the base commit's parent.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_ENABLE_COMMENTS: 'false'

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --lockfile=Cargo.lock
            --lockfile=package-lock.json
