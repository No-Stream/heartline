---
name: CI

"on":
  push:
    branches: [main, master]
  pull_request:

# Every job has a timeout, because GitHub's default of 360 minutes lets a hung step
# occupy a required check for six hours. Revisit the caps once real timings exist.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml pins the version, components and WebAssembly target.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: make install
      # TypeScript checks import the generated WebAssembly bindings.
      - run: npx playwright install --with-deps chrome
      - run: make build
      - run: make lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: make install
      # make test-web rasterizes the sprite atlas through headless Chrome.
      - run: npx playwright install --with-deps chrome
      - run: make build
      - run: make test-rust
      - run: make test-web

  test-threads:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: make test-threads

  test-flexibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: make test-flexibility

  e2e-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: make install
      - run: npx playwright install --with-deps chrome
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-build
          path: |
            web/art/atlas/
            web/src/wasm/
            web/dist/
          if-no-files-found: error
          retention-days: 1

  e2e:
    needs: e2e-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # The feature project takes about 13 minutes locally and longer on hosted runners, so it is split in three.
          - { project: feature, shard: 1/3 }
          - { project: feature, shard: 2/3 }
          - { project: feature, shard: 3/3 }
          - { project: journey, shard: 1/1 }
          - { project: smoothness, shard: 1/1 }
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
        if: matrix.project == 'feature'
      - uses: Swatinem/rust-cache@v2
        if: matrix.project == 'feature'
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: make install
      - run: npx playwright install --with-deps chrome
      - uses: actions/download-artifact@v4
        with:
          name: e2e-build
          path: web/
      - run: npm run e2e -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/

  secret_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # The action scans a commit range, so it needs the base commit's parent.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_ENABLE_COMMENTS: 'false'

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --lockfile=Cargo.lock
            --lockfile=package-lock.json
