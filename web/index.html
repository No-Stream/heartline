<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Theme Park Sim</title>
    <style>
      html, body { height: 100%; }
      body {
        margin: 0;
        overflow: hidden;
        color: #3a2e58;
        background: #e9e0cf;
        font: 0.9rem/1.4 Georgia, "Times New Roman", serif;
      }
      /* Whole-pixel bar height and dock width keep the canvas on the pixel grid, so screenshots of it stay sharp and stable. */
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-rows: 44px minmax(0, 1fr);
        height: 100vh;
        height: 100dvh;
      }
      .game-bar {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 0 16px;
        background: var(--paper);
        border-bottom: var(--key-line);
        /* Inset, so the bar never draws over the world canvas. */
        box-shadow: inset 0 -3px 0 color-mix(in srgb, var(--mustard) 40%, transparent);
      }
      .game-bar h1 {
        margin: 0;
        font: 600 18px/1 var(--body-font);
        letter-spacing: 0.02em;
        white-space: nowrap;
      }
      .game-bar p {
        margin: 0;
        color: var(--ink-soft);
        font: italic 0.78rem/1 var(--body-font);
        white-space: nowrap;
      }
      .game-world { position: relative; min-width: 0; min-height: 0; }
      .game-world > canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        /* The renderer leaves some pixels translucent; keep what shows through them as before. */
        background: #fff;
      }
      .game-world > canvas:focus-visible { outline: 2px solid var(--slate); outline-offset: -2px; }
      .game-dock {
        box-sizing: border-box;
        width: 400px;
        overflow-y: auto;
        overscroll-behavior: contain;
        background: var(--paper);
        border-left: var(--key-line);
        scrollbar-color: var(--ink-faint) transparent;
      }
      .game-dock[hidden] { display: none; }
      /* Room for the day clock: the tick readout keeps its number but drops its label on narrower windows. */
      @media (max-width: 1300px) { .game-bar__tick-label { display: none; } }
      @media (max-width: 1060px) { .game-bar h1, .game-bar p { display: none; } }
      @media (max-width: 760px) {
        main { grid-template-columns: minmax(0, 1fr); grid-template-rows: 44px minmax(0, 1fr) auto; }
        .game-bar h1, .game-bar p { display: none; }
        .game-dock { width: auto; max-height: 45vh; border-left: 0; border-top: var(--key-line); }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="game-bar">
        <h1>Theme Park Sim</h1>
        <div data-toolbar></div>
        <div data-day-clock></div>
        <p><span class="game-bar__tick-label">Simulation ticks: </span><output data-testid="tick-count" aria-label="Simulation ticks">0</output></p>
      </header>
      <div class="game-world">
        <canvas aria-label="Theme park world" tabindex="0" style="touch-action: none" width="800" height="500"></canvas>
      </div>
      <aside class="game-dock" aria-label="Tool panel" data-dock hidden>
        <section aria-label="Coaster construction" data-construction hidden></section>
        <section aria-label="Paths" data-paths hidden></section>
        <section aria-label="Landscaping" data-landscaping hidden></section>
        <section aria-label="Scenery" data-scenery hidden></section>
        <section aria-label="Park facilities" data-facilities hidden></section>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
