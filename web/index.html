<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heartline</title>
  </head>
  <body>
    <main>
      <header class="game-bar">
        <h1>Heartline</h1>
        <div data-toolbar></div>
        <div data-day-clock></div>
        <p><span class="game-bar__tick-label">Simulation ticks: </span><output data-testid="tick-count" aria-label="Simulation ticks">0</output></p>
        <div data-theme-toggle></div>
        <div data-units-setting></div>
        <div data-sound-setting></div>
      </header>
      <div class="game-world">
        <canvas aria-label="Theme park world" tabindex="0" style="touch-action: none" width="800" height="500"></canvas>
        <div data-force-overlay hidden></div>
        <div class="height-markers" data-height-markers hidden>
          <strong data-track-height></strong>
          <span data-station-height></span>
        </div>
      </div>
      <aside class="game-dock" aria-label="Tool panel" data-dock hidden>
        <section aria-label="Coaster construction" data-construction hidden></section>
        <p class="game-dock__tunnel-preview" data-tunnel-preview aria-live="polite" hidden></p>
        <section aria-label="Paths" data-paths hidden></section>
        <section aria-label="Landscaping" data-landscaping hidden></section>
        <section aria-label="Scenery" data-scenery hidden></section>
        <section aria-label="Park facilities" data-facilities hidden></section>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
