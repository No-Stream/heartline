[workspace]
members = ["crates/sim", "crates/sim-wasm"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
wasm-bindgen = "=0.2.105"

# Full debug info made each worktree's debug build about 7 GB; line tables keep backtraces with file and line.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test.package.theme-park-sim]
opt-level = 2

